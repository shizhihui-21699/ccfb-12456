name: Label PR by title
on:
  pull_request_target:
    types: [opened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: |
          echo "New PR: ${{ github.event.pull_request.title }}"
      - name: Grep title
        run: |
          if echo "${{ github.event.pull_request.title }}" | grep -q '^\[urgent\]'; then
            echo "urgent"
          fi
      - uses: actions/github-script@v7
        with:
          script: |
            const title = "${{ github.event.pull_request.title }}";
            console.log(title);
