name: PR Preview Comment
on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Validate metadata only
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Data goes through env; shell quoting protects it.
          printf '%s\n' "$PR_TITLE" | head -c 200
          gh pr comment "$PR_NUMBER" --body "Thanks!"
